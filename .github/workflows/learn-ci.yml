name: 5C Learn CI
on:
  push: { paths: ["apps/learn/**", "supabase/**", "scripts/ci/**", "content/**", ".github/workflows/learn-ci.yml"] }
  pull_request: { paths: ["apps/learn/**", "supabase/**", "scripts/ci/**", "content/**"] }
jobs:
  gates:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/learn } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5499:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5499/learn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/learn/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -q postgresql-client
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Apply migrations to a fresh Postgres
        run: npm run db:reset
      - name: RLS proof (student isolation, no client-side score/certificate writes)
        run: npm run test:rls
      - name: Contrast tokens
        run: python3 scripts/verify-contrast.py
      - name: Compliance gate (SEBI number, Tier-1 bytes, Devanagari, emoji, banned phrases, stat stamps, cyan+white)
        run: python3 ../../scripts/ci/check_compliance.py src .next/server/app ../../content ../../supabase
      - name: Responsive gate (interim checker)
        run: python3 ../../scripts/ci/check_responsive.py src .next/server/app
