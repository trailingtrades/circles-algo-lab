name: 5C Learn CI
on:
  push: { paths: ["apps/learn/**", "scripts/ci/**", "content/**", ".github/workflows/learn-ci.yml"] }
  pull_request: { paths: ["apps/learn/**", "scripts/ci/**", "content/**"] }
jobs:
  gates:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/learn } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/learn/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - name: Contrast tokens
        run: python3 scripts/verify-contrast.py
      - name: Compliance gate (SEBI number, Tier-1 bytes, Devanagari, emoji, banned phrases, stat stamps, cyan+white)
        run: python3 ../../scripts/ci/check_compliance.py src .next/server/app ../../content
      - name: Responsive gate (interim checker)
        run: python3 ../../scripts/ci/check_responsive.py src .next/server/app
