name: Delete Vercel project (decommission)
# One-off (18 Sep 2026, Rahul's call): the app is fully self-hosted on the VPS; the Vercel
# project circles-algo-lab has been dormant since the 17-Sep migration. This deletes it
# permanently (deployments and the circles-algo-lab.vercel.app alias die with it).
on: workflow_dispatch
jobs:
  delete:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TEAM: team_zAmVNOZ45AuOCiuewGfmpTvT
      PROJECT: prj_7xYqX0IXME5JgB2LTcuz1goFJOEw
    steps:
      - name: Delete project
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X DELETE \
            "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          echo "DELETE -> $code"; cat /tmp/out; echo
          case "$code" in 2*) echo "deleted";; 404) echo "already gone";; *) exit 1;; esac
      - name: Verify
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$PROJECT?teamId=$TEAM" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          [ "$code" = "404" ] && echo "confirmed: project no longer exists" || { echo "::error::project still exists (HTTP $code)"; exit 1; }
