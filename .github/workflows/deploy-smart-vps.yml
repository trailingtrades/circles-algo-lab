name: Deploy 5C Learn (VPS /smart)
# Builds apps/learn as a self-hosted Next.js standalone bundle (basePath /smart) and publishes it
# to the `smart-vps` GitHub release. The VPS (learn.optionlab.co.in) cannot accept inbound SSH from
# GitHub runners (provider firewall allows only Rahul's IPs), so deploys are PULL-based: a systemd
# timer on the box (smart-pull.timer -> /usr/local/bin/smart-pull.sh, every 2 min) downloads the new
# asset, decrypts env.age with /root/.config/smart-deploy.key, swaps the release symlink and restarts
# the `learn-smart` unit (127.0.0.1:3001 behind nginx snippet smart-app.conf).
# Secrets travel ONLY inside env.age, encrypted to the VPS's age public key — the repo is public.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # deploy-vps/ holds reference copies of box config (installed by hand), not app code.
    paths: ["apps/learn/**", "content/**", ".github/workflows/deploy-smart-vps.yml", "!apps/learn/deploy-vps/**"]
concurrency: { group: deploy-smart-vps, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # The VPS deploy key's PUBLIC half (age-keygen on the box; private key never leaves it).
      VPS_AGE_PUBKEY: age1d5d4nkmdhnjcn5gay0y3x8hlzkgke3h2ks6vcqh9qkep70ae0yzqm7ns92
      # Public values (shipped to every browser) — same source of truth as deploy-learn.yml.
      NEXT_PUBLIC_SUPABASE_URL: https://hcajzeykcdcxqidgmzep.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_gAfSezP8b8W_9sF_MJA7XQ_9yEGxdRo
      NEXT_PUBLIC_SITE_URL: https://learn.optionlab.co.in/smart
      NEXT_PUBLIC_BASE_PATH: /smart
      NEXT_OUTPUT_STANDALONE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/learn/package-lock.json }
      - name: Build (standalone, basePath /smart)
        working-directory: apps/learn
        run: |
          npm ci
          npm run build
          # Standalone mirrors the monorepo layout because outputFileTracingRoot is the repo root.
          cp -r .next/static .next/standalone/apps/learn/.next/static
          cp -r public .next/standalone/apps/learn/public
          tar -C .next/standalone -czf /tmp/smart-app.tgz .
      - name: Encrypt runtime env for the VPS
        env:
          # Required: an empty value fails the deploy (without them the app would boot keyless).
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CERT_SIGNING_SECRET: ${{ secrets.CERT_SIGNING_SECRET }}
          # Optional: each line is written only when its secret/variable is set, so an unset one stays unset in
          # the app instead of becoming "" (an empty EMAIL_FROM= would override the code's default sender).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM }}
          MASTER_ADMIN_EMAIL: ${{ secrets.MASTER_ADMIN_EMAIL }}
          CERT_RENDER_MODE: ${{ secrets.CERT_RENDER_MODE || vars.CERT_RENDER_MODE }}
          # Secret names may not start with GITHUB_, so the app's GITHUB_DISPATCH_TOKEN is saved as CERT_DISPATCH_TOKEN.
          CERT_DISPATCH_TOKEN: ${{ secrets.CERT_DISPATCH_TOKEN }}
          CERT_DISPATCH_REPO: ${{ github.repository }}
        run: |
          sudo apt-get install -y -qq age >/dev/null
          umask 077
          put() { # KEY VALUE [required] -> one KEY=VALUE line on stdout. Values are never echoed.
            local v; v=$(printf '%s' "$2" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -z "$v" ]; then [ -z "$3" ] || { echo "::error::$1 is empty — add it under Settings → Secrets and variables → Actions" >&2; exit 1; }; return 0; fi
            case "$v" in *$'\n'*) echo "::error::$1 spans several lines — re-save it as a single line" >&2; exit 1;; esac
            printf '%s=%s\n' "$1" "$v"
          }
          # Optional values that are set but malformed are skipped with a warning rather than shipped.
          M="${MASTER_ADMIN_EMAIL//[[:space:]]/}"
          [ -z "$M" ] || [[ "$M" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]] || { echo "::warning::MASTER_ADMIN_EMAIL is not a plain email address — not written"; M=; }
          case "$CERT_RENDER_MODE" in ""|local|dispatch) ;; *) echo "::warning::CERT_RENDER_MODE must be local or dispatch — not written"; CERT_RENDER_MODE=;; esac
          case "$EMAIL_FROM" in ""|*@*) ;; *) echo "::warning::EMAIL_FROM has no address in it — not written"; EMAIL_FROM=;; esac
          {
            put NEXT_PUBLIC_SUPABASE_URL "$NEXT_PUBLIC_SUPABASE_URL" required
            put NEXT_PUBLIC_SUPABASE_ANON_KEY "$NEXT_PUBLIC_SUPABASE_ANON_KEY" required
            put NEXT_PUBLIC_SITE_URL "$NEXT_PUBLIC_SITE_URL" required
            put SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY" required
            put CERT_SIGNING_SECRET "$CERT_SIGNING_SECRET" required
            put RESEND_API_KEY "$RESEND_API_KEY"
            put EMAIL_FROM "$EMAIL_FROM"
            put MASTER_ADMIN_EMAIL "$M"
            put CERT_RENDER_MODE "$CERT_RENDER_MODE"
            put GITHUB_DISPATCH_TOKEN "$CERT_DISPATCH_TOKEN"
            [ -z "$CERT_DISPATCH_TOKEN" ] || put GITHUB_REPO "$CERT_DISPATCH_REPO"
          } > /tmp/learn-smart.env
          echo "env.age carries: $(cut -d= -f1 /tmp/learn-smart.env | tr '\n' ' ')"
          age -e -r "$VPS_AGE_PUBKEY" -o /tmp/env.age /tmp/learn-smart.env
          rm /tmp/learn-smart.env
      - name: Publish to the smart-vps release
        run: |
          gh release view smart-vps >/dev/null 2>&1 || \
            gh release create smart-vps --title "CIRCLE S.M.A.R.T VPS build" \
              --notes "Rolling release consumed by smart-pull.timer on the VPS. Do not delete."
          # env first so a pull triggered by the new tgz never pairs it with a stale env.
          gh release upload smart-vps /tmp/env.age /tmp/smart-app.tgz --clobber
          echo "published $(git rev-parse --short HEAD)"
      - name: Wait for the VPS to pull and go live
        run: |
          H=learn.optionlab.co.in
          echo "waiting for smart-pull.timer (runs every 2 min) ..."
          for i in $(seq 1 24); do
            sleep 15
            body=$(curl -s --resolve $H:443:200.141.9.107 https://$H/smart/api/health || true)
            if echo "$body" | grep -q '"ok":true'; then echo "app is live after ~$((i*15))s"; ok=1; break; fi
          done
          [ "${ok:-}" = "1" ] || { echo "::error::VPS did not serve /smart/api/health within 6 min — check smart-pull logs on the box"; exit 1; }
      - name: Smoke test
        run: |
          H=learn.optionlab.co.in
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --resolve $H:443:200.141.9.107 https://$H/smart/)
          final=$(curl -s -o /dev/null -w '%{url_effective}' -L --resolve $H:443:200.141.9.107 https://$H/smart/)
          echo "/smart/ -> $code (final: $final)"
          [ "$code" = "200" ] || { echo "::error::/smart/ returned $code"; exit 1; }
          # Static neighbours must still be served from disk, not the app.
          for p in / /smart/about/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --resolve $H:443:200.141.9.107 https://$H$p); echo "$p -> $c"
            [ "$c" = "200" ] || { echo "::error::$p returned $c"; exit 1; }
          done
          # Gated stages: anonymous = 302 to the SMART sign-in (stage gate, 17 Sep 2026).
          # 200 also passes so the smoke test survives enforcement being switched off.
          for p in /winners/ /one/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' --resolve $H:443:200.141.9.107 https://$H$p); echo "$p -> $c"
            [ "$c" = "302" ] || [ "$c" = "200" ] || { echo "::error::$p returned $c"; exit 1; }
          done
