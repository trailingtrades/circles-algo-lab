name: Deploy 5C Learn (Vercel)
# Builds apps/learn on Vercel and promotes it to production. Runs on every push to main that touches the app or
# content, or manually from Actions -> "Deploy 5C Learn (Vercel)" -> Run workflow.
# Required repo secret: VERCEL_TOKEN (Vercel -> Account -> Tokens). Project/team ids are fixed below (not secrets).
# RETIRED 17 Sep 2026: the app is self-hosted on the VPS (see deploy-smart-vps.yml and
# apps/learn/deploy-vps/). Manual dispatch kept only as a fallback until the Vercel
# project is deleted.
on:
  workflow_dispatch:
concurrency: { group: deploy-learn, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_zAmVNOZ45AuOCiuewGfmpTvT
      VERCEL_PROJECT_ID: prj_7xYqX0IXME5JgB2LTcuz1goFJOEw
      # Public production URL. Unique deployment URLs sit behind Vercel Authentication and redirect to vercel.com.
      # learn.optionlab.co.in DNS points at the VPS (static Academy landing); the app lives on the vercel.app alias.
      PROD_URL: https://circles-algo-lab.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preflight
        run: '[ -n "$VERCEL_TOKEN" ] || { echo "::error::secret VERCEL_TOKEN is not set (Vercel -> Account -> Tokens)"; exit 1; }'
      - name: Ensure public env vars on Vercel
        # These are PUBLIC values (shipped to every browser), so they live here rather than in secrets.
        # Re-setting them from a known-good source fixes hand-paste errors (hidden characters, wrong key).
        env:
          PUB_SUPABASE_URL: https://hcajzeykcdcxqidgmzep.supabase.co
          PUB_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhjYWp6ZXlrY2RjeHFpZGdtemVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0Mzg0OTEsImV4cCI6MjEwNTAxNDQ5MX0.NFO6ofobvDON2TfAGzE2b8tK8kymDUl5uxcUAyPFeHY
        run: |
          # Vercel REST API upsert (the CLI prompts interactively for anything that looks like a credential).
          set_env() { # name value
            code=$(curl -s -o /tmp/env.json -w '%{http_code}' -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"key":sys.argv[1],"value":sys.argv[2],"type":"plain","target":["production","preview"]}))' "$1" "$2")")
            case "$code" in 2*) echo "set $1";; *) echo "::error::could not set $1 (HTTP $code): $(head -c 300 /tmp/env.json)"; exit 1;; esac
          }
          set_env NEXT_PUBLIC_SUPABASE_URL "$PUB_SUPABASE_URL"
          set_env NEXT_PUBLIC_SUPABASE_ANON_KEY "$PUB_ANON_KEY"
          set_env NEXT_PUBLIC_SITE_URL "$PROD_URL"
      - name: Deploy to production
        id: deploy
        run: |
          npm i -g vercel@latest >/dev/null
          # Build on Vercel with the project's stored settings (root apps/learn, env vars) and promote to production.
          url=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2> >(tee /tmp/vercel.log >&2))
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed: $url"
      - name: Smoke test
        run: |
          u="$PROD_URL"; echo "testing $u"
          for p in /learn /verify/lookup; do
            code=$(curl -s --compressed -o /tmp/body -w '%{http_code}' -L "$u$p"); echo "$p -> $code (final url: $(curl -s -o /dev/null -w '%{url_effective}' -L "$u$p"))"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; head -c 400 /tmp/body; exit 1; }
          done
          grep -q "INH000020004" /tmp/body && echo "SEBI registration number present" || { echo "::error::SEBI reg no missing on /verify/lookup"; exit 1; }
          echo "health:"; curl -s --compressed "$u/api/health"; echo
          curl -s --compressed "$u/api/health" | grep -q '"ok":true' || echo "::warning::/api/health reports a Supabase configuration problem (see above)"
