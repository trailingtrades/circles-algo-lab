# CIRCLE S.M.A.R.T — Next.js app self-hosted on this box (systemd unit: learn-smart,
# 127.0.0.1:3001, built with basePath /smart). Deployed by GitHub Actions
# deploy-smart-vps.yml in trailingtrades/circles-algo-lab. The static course-details
# page /smart/about/ stays on disk; the longer prefix wins over the proxy below.
location = /smart/about { return 301 https://$host/smart/about/; }
location ^~ /smart/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
location ^~ /smart {
    # Security headers, same set the app had from vercel.json on Vercel (removed 18 Sep 2026).
    # nginx add_header REPLACES every inherited add_header at this level, so the full set lives here.
    # The nested locations below declare no add_header, so they inherit this set unchanged.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # The app is sign-in only — keep every /smart URL out of search results. The public sales
    # page /smart/about/ is a sibling location above, so it is not covered and stays indexable.
    add_header X-Robots-Tag "noindex" always;
    proxy_hide_header X-Powered-By;
    # smart_node = 127.0.0.1:3001 with a keepalive pool (conf.d/learn-perf.conf); the empty
    # Connection header is what lets the pool actually be reused.
    proxy_pass http://smart_node;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    # DNS points straight at this box (no CDN in front), so nginx is the edge: the app gets the
    # connecting address only, never a client-supplied X-Forwarded-For (the verify page rate
    # limit keys on it).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;

    # Flood guard for the whole app (zone: conf.d/learn-botguard.conf): 30 r/s per address with
    # burst 100 covers a browser's first-load asset burst twice over; a scraper or junior DoS
    # gets the same 429 body the auth limiter uses. Raise rate+burst together for classrooms.
    limit_req zone=smart_flood burst=100 nodelay;

    # Next's hashed immutable assets, cached by nginx (store: conf.d/learn-perf.conf) so the
    # single Node process only renders pages. A deploy changes every filename, so stale entries
    # are never served to a new build; use_stale keeps assets flowing through an app restart.
    location ^~ /smart/_next/static/ {
        proxy_pass http://smart_node;
        proxy_cache smart_static;
        proxy_cache_valid 200 30d;
        proxy_cache_valid any 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }

    # Sign-in, invite-accept and password-reset. Next server actions POST to the page's own URL;
    # the smart_auth zone (conf.d/learn-ratelimit.conf) counts POSTs only, so page loads are never
    # throttled. Every Supabase auth call leaves from this one VPS address, so one noisy client
    # must not be able to use up the whole school's sign-in allowance.
    # This zone is only the first line: Next runs a server action at ANY page URL that registers it,
    # and signIn/requestReset are registered on every signed-in page too (/smart/learn/home, ...),
    # which these locations never see. So those actions also check a per-address and per-email limit
    # themselves (src/lib/auth/rateLimit.ts). Do not widen this zone to every POST carrying a
    # Next-Action header: exam autosave, lesson progress and the journal would get 429s mid-exam.
    # The 429 is plain text "rate_limited": Next hands a text/plain error body to the form as the error
    # message, and the forms (lib/auth/useAuthAction.ts) turn it into "Too many attempts" in three languages.
    limit_req_status 429;
    error_page 429 = @smart_rate_limited;
    # Declaring limit_req here replaces the inherited set, so the general smart_flood zone is
    # repeated alongside smart_auth — both apply (auth counts POSTs, flood counts everything).
    location = /smart/learn {
        limit_req zone=smart_auth burst=10 nodelay;
        limit_req zone=smart_flood burst=100 nodelay;
        proxy_pass http://smart_node;
    }
    location ^~ /smart/learn/invite/ {
        limit_req zone=smart_auth burst=10 nodelay;
        limit_req zone=smart_flood burst=100 nodelay;
        proxy_pass http://smart_node;
    }
    location ^~ /smart/learn/reset {
        limit_req zone=smart_auth burst=10 nodelay;
        limit_req zone=smart_flood burst=100 nodelay;
        proxy_pass http://smart_node;
    }

    # Stage 0 — CIRCLE S.T.A.R.T (static course files in the app bundle, public/stage0/):
    # sign-in required, no per-stage grant. 401 bounces to the SMART sign-in with ?next=
    # back here. Self-contained (own _gate target and named location below), so it works
    # with either academy-paths snippet variant.
    location = /smart/stage0 { return 301 https://$host/smart/stage0/; }
    location ^~ /smart/stage0/ {
        auth_request /_gate/stage0;
        error_page 401 = @stage0_login;
        error_page 403 = @stage0_login;
        proxy_pass http://smart_node;
    }
}
location @smart_rate_limited {
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 429 "rate_limited";
}

# auth_request target for the Stage 0 gate (mirrors _gate/winners in academy-paths-gated.conf).
location = /_gate/stage0 {
    internal;
    proxy_pass http://smart_node/smart/api/gate/stage0;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location @stage0_login { return 302 /smart/learn?next=$request_uri; }
