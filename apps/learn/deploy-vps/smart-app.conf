# CIRCLE S.M.A.R.T — Next.js app self-hosted on this box (systemd unit: learn-smart,
# 127.0.0.1:3001, built with basePath /smart). Deployed by GitHub Actions
# deploy-smart-vps.yml in trailingtrades/circles-algo-lab. The static course-details
# page /smart/about/ stays on disk; the longer prefix wins over the proxy below.
location ^~ /smart/about/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /smart {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
