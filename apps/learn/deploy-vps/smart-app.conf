# CIRCLE S.M.A.R.T — Next.js app self-hosted on this box (systemd unit: learn-smart,
# 127.0.0.1:3001, built with basePath /smart). Deployed by GitHub Actions
# deploy-smart-vps.yml in trailingtrades/circles-algo-lab. The static course-details
# page /smart/about/ stays on disk; the longer prefix wins over the proxy below.
location ^~ /smart/about/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location ^~ /smart {
    # Security headers, same set the app had from vercel.json on Vercel (removed 18 Sep 2026).
    # nginx add_header REPLACES every inherited add_header at this level, so the full set lives here.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self'; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
}
