# 5 Circles Academy paths on learn.optionlab.co.in — included from the learn server
# block (see deploy-academy.sh --setup). Layout since 2026-08-26:
#
#   /            Academy landing (Journey page)         /var/www/learn-5circles/index.html
#   /winners/    CIRCLE W.I.N.N.E.R.S dashboard          .../winners/index.html  (was at /)
#   /one/        CIRCLE1 O.N.E, 76-chapter programme     .../one/index.html
#   /fonts/      IBM Plex, shared by all three pages     .../fonts/*.woff2
#   /decks/ /atlas/ /admin.html  unchanged
#
# nginx add_header REPLACES every inherited add_header at the level it appears, so each
# location below repeats the three security headers rather than relying on the
# server-level ones. Leaving them out is how a path quietly loses nosniff /
# X-Frame-Options / Referrer-Policy.

location = /winners { return 301 https://$host/winners/; }
location = /one     { return 301 https://$host/one/; }

# Both programmes are single self-contained HTML files, rebuilt whenever content ships
# and kept open in long-lived tabs: revalidate every time, like the dashboard always has.
location /winners/ {
    auth_request /_gate/winners;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
location /one/ {
    auth_request /_gate/one;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Fonts change only under a new filename; cache hard. CORS header because @font-face
# fetches are CORS-mode even on the same origin when `crossorigin` preload is used.
location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    types { font/woff2 woff2; }
}

# ---- stage gate (one login, per-stage unlock) ------------------------------------
# auth_request targets: the learn-smart app answers 200 (entitled), 401 (not signed
# in) or 403 (signed in, not granted) from the stage_access table, logging visits.
location = /_gate/winners {
    internal;
    proxy_pass http://127.0.0.1:3001/smart/api/gate/winners;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /_gate/one {
    internal;
    proxy_pass http://127.0.0.1:3001/smart/api/gate/one;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location @stage_login  { return 302 /smart/learn?next=$request_uri; }
location @stage_denied { return 302 /smart/learn/home; }
