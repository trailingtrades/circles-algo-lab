# 5 Circles Academy paths on learn.optionlab.co.in — included from the learn server
# block (see deploy-academy.sh --setup). Layout since 2026-08-26:
#
#   /            Academy landing (Journey page)         /var/www/learn-5circles/index.html  (academy-site.conf)
#   /funda/      CIRCLE F.U.N.D.A, Dhandhe Ki Kahani     .../funda/index.html
#   /winners/    CIRCLE W.I.N.N.E.R.S dashboard          .../winners/index.html  (was at /)
#   /winners-plus/  CIRCLE W.I.N.N.E.R.S + (Algo Ki Kahani)  .../winners-plus/index.html
#   /one/        CIRCLE1 O.N.E, 76-chapter programme     .../one/index.html
#   /winners/about/ /winners-plus/about/ /one/about/   public course-detail pages (sales pages, never gated)
#   /fonts/      IBM Plex, shared by all three pages     .../fonts/*.woff2
#   /decks/ /atlas/  unchanged; /admin.html closed in academy-site.conf
#   /smart/stage0/   CIRCLE S.T.A.R.T, sign-in-gated in smart-app.conf (not here)
#
# nginx add_header REPLACES every inherited add_header at the level it appears, so each
# location below includes the full header set (learn-static-headers.conf) rather than
# relying on the server-level ones. Leaving it out is how a path quietly loses them.

location = /funda   { return 301 https://$host/funda/; }
location = /winners { return 301 https://$host/winners/; }
location = /winners-plus { return 301 https://$host/winners-plus/; }
location = /one     { return 301 https://$host/one/; }
location = /pro/options { return 301 https://$host/pro/options/; }
location = /funda/about   { return 301 https://$host/funda/about/; }
location = /winners/about { return 301 https://$host/winners/about/; }
location = /winners-plus/about { return 301 https://$host/winners-plus/about/; }
location = /one/about     { return 301 https://$host/one/about/; }

# Course details for Stages 2 and 3 are linked from the landing for people who have not bought
# yet, so they stay outside the gate. ^~ plus the longer prefix beats the gated blocks below.
location ^~ /funda/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
location ^~ /winners/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
location ^~ /winners-plus/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
location ^~ /one/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
# Public course page for CIRCLE PRO · Options 117 — the longer ^~ prefix beats the gated
# /pro/options/ block below, exactly like /winners/about/ vs /winners/.
location = /pro/options/about { return 301 https://$host/pro/options/about/; }
location ^~ /pro/options/about/ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}

# Both programmes are single self-contained HTML files, rebuilt whenever content ships
# and kept open in long-lived tabs: revalidate every time, like the dashboard always has.
# error_page 404 is repeated because a location's own error_page list replaces the server's.
# CIRCLE F.U.N.D.A (Stage 2): Dhandhe Ki Kahani, one self-contained ~1.4 MB HTML file.
# Ships from ctc-tools tools/5circles-academy/deploy/deploy-academy.sh (source: tools/funda-course/).
location /funda/ {
    auth_request /_gate/funda;
    auth_request_set $gate_reason $upstream_http_x_gate_reason;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
    gzip on;
    gzip_types text/html;
}
location /winners/ {
    auth_request /_gate/winners;
    auth_request_set $gate_reason $upstream_http_x_gate_reason;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
# CIRCLE W.I.N.N.E.R.S + (Stage 2+, Algo Ki Kahani): one self-contained HTML page plus its
# cast/ images. ^~ so the longer prefix always beats /winners/ for /winners-plus/… requests.
location ^~ /winners-plus/ {
    auth_request /_gate/winners_plus;
    auth_request_set $gate_reason $upstream_http_x_gate_reason;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
location /one/ {
    auth_request /_gate/one;
    auth_request_set $gate_reason $upstream_http_x_gate_reason;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}

# CIRCLE PRO · Options 117 (Stage 4, first track): index.html ~15 MB plus the en.json ~14 MB the
# page's EN toggle fetches from the same path — both sit behind the same gate. gzip pays for
# itself at these sizes. Ships from ctc-tools tools/5circles-academy/deploy/deploy-academy.sh.
location ^~ /pro/options/ {
    auth_request /_gate/pro_options;
    auth_request_set $gate_reason $upstream_http_x_gate_reason;
    error_page 401 = @stage_login;
    error_page 403 = @stage_denied;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
    gzip on;
    gzip_types text/html application/json;
}

# Fonts change only under a new filename; cache hard. CORS header because @font-face
# fetches are CORS-mode even on the same origin when `crossorigin` preload is used.
location /fonts/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    include /etc/nginx/snippets/learn-static-headers.conf;
    types { font/woff2 woff2; }
}

# ---- stage gate (one login, per-stage unlock) ------------------------------------
# auth_request targets: the learn-smart app answers 200 (entitled), 401 (not signed
# in) or 403 (signed in, not granted, with X-Gate-Reason) from stage_access, logging visits.
location = /_gate/funda {
    internal;
    proxy_pass http://smart_node/smart/api/gate/funda;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /_gate/winners {
    internal;
    proxy_pass http://smart_node/smart/api/gate/winners;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /_gate/winners_plus {
    internal;
    proxy_pass http://127.0.0.1:3001/smart/api/gate/winners_plus;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /_gate/one {
    internal;
    proxy_pass http://smart_node/smart/api/gate/one;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location = /_gate/pro_options {
    internal;
    proxy_pass http://smart_node/smart/api/gate/pro_options;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
}
location @stage_login  { return 302 /smart/learn?next=$request_uri; }
# The gate's X-Gate-Reason (no_access | not_started | expired) rides along so Home can say why.
# auth_request sets the variable before the error_page redirect, so it survives into this location.
location @stage_denied { return 302 /smart/learn/home?stage_denied=$gate_reason; }
