# Performance pieces for the /smart app — http-context (upstream + cache store).
# Installed as /etc/nginx/conf.d/learn-perf.conf. Added 25 Sep 2026 (APPLY-2026-09-25.md).

# One shared upstream for every proxy_pass to the Node app, with a keepalive pool: without it
# each proxied request (pages, RSC fetches, every auth_request gate check on the static stages)
# opens and closes its own TCP connection to 127.0.0.1:3001. Locations that use it must send
# `proxy_http_version 1.1;` and `proxy_set_header Connection "";` or keepalive never engages.
upstream smart_node {
    server 127.0.0.1:3001;
    keepalive 32;
}

# Cache for Next's hashed immutable assets (/smart/_next/static/): a content change always gets
# a new filename, so 30 days is safe. Serving these from nginx instead of Node removes most of
# the request volume from the single app process — Node then only renders pages. use_temp_path
# off writes straight into the cache. The directory is created by apply-nginx.sh
# (install -d -o www-data /var/cache/nginx-smart).
proxy_cache_path /var/cache/nginx-smart levels=1:2 keys_zone=smart_static:10m max_size=300m inactive=30d use_temp_path=off;
