# Root-level pages of learn.optionlab.co.in: the Academy landing, the branded 404 and the Mentor Desk.
# Installed as /etc/nginx/snippets/academy-site.conf and included from the 443 server block next to the
# academy-paths include. `location = /` and `location = /admin.html` used to live in the server block
# itself; APPLY-2026-09-19.md comments those copies out there, so each exists exactly once. Kept apart
# from academy-paths(-gated).conf so the gate ON/OFF include swap in README.md never touches them.

# Any 404 nginx itself produces (static paths; the /smart app renders its own) gets the branded page.
error_page 404 /404.html;

# --- bot guard (server-wide; maps + zones in conf.d/learn-botguard.conf) ---------------------
# Known scraper/AI-crawler user agents are cut before any location work happens, and one
# address holds at most 30 concurrent connections (the O.N.E/PRO pages are 9–15 MB files —
# without a cap one address can starve every other download). Added 25 Sep 2026.
if ($block_bot) { return 403; }
limit_conn perip 30;

# robots.txt for the whole host. The landing and the public /about/ sales pages stay indexable
# for search; the app and the gated course pages are private, so polite crawlers are told to
# stay out (nginx auth + noindex headers enforce it for the impolite ones). The named AI-training
# crawlers are opted out entirely — the course content is the paid product. Longest-match wins,
# so the Allow lines beat the Disallow of their parent paths.
location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "max-age=3600";
    return 200 "User-agent: *\nAllow: /funda/about/\nAllow: /winners/about/\nAllow: /one/about/\nAllow: /pro/options/about/\nAllow: /smart/about/\nDisallow: /smart/\nDisallow: /funda/\nDisallow: /winners/\nDisallow: /one/\nDisallow: /pro/\nDisallow: /admin.html\n\nUser-agent: GPTBot\nDisallow: /\n\nUser-agent: CCBot\nDisallow: /\n\nUser-agent: ClaudeBot\nDisallow: /\n\nUser-agent: anthropic-ai\nDisallow: /\n\nUser-agent: Google-Extended\nDisallow: /\n\nUser-agent: Applebot-Extended\nDisallow: /\n\nUser-agent: Bytespider\nDisallow: /\n\nUser-agent: meta-externalagent\nDisallow: /\n";
}

location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/learn-static-headers.conf;
}

location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex" always;
    include /etc/nginx/snippets/learn-static-headers.conf;
}

# Mentor Desk: legacy access-code tool + live-session admin. Its script carries the code-signing
# peppers, so it is closed to the internet and answers like a missing page. To open it from one
# address, replace RAHUL_IP below and uncomment (APPLY-2026-09-19.md, "Open the Mentor Desk").
location = /admin.html {
    # allow RAHUL_IP;
    deny all;
    error_page 403 =404 /404.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/learn-static-headers.conf;
}
