# Bot and flood guard for learn.optionlab.co.in — http-context pieces (maps + zones).
# Installed as /etc/nginx/conf.d/learn-botguard.conf (conf.d is included from the http{} block).
# Enforcement lives where server/location context is allowed: academy-site.conf carries the
# server-wide `if ($block_bot) { return 403; }` and the per-address connection cap; smart-app.conf
# applies the smart_flood request limit to the app. Added 25 Sep 2026 (APPLY-2026-09-25.md).

# --- known-bad crawlers, by User-Agent -------------------------------------------------------
# Three groups: SEO/index scrapers that hammer sites for their own databases; AI-training
# crawlers (we opt out — course content is the paid product); HTTP-library defaults that no
# real student's browser ever sends. Deliberately NOT matched:
#   curl                — the deploy workflow and smoke tests health-check with it
#   facebookexternalhit + WhatsApp — WhatsApp link previews (enrolment runs on WhatsApp)
#   TelegramBot         — Telegram link previews
#   Googlebot/Bingbot/DuckDuckBot — search listings for the landing and /about/ sales pages
#   empty UA            — some uptime probes send none; robots.txt + rate limits still apply
map $http_user_agent $block_bot {
    default 0;
    "~*(semrushbot|ahrefsbot|mj12bot|dotbot|blexbot|dataforseobot|serpstatbot|petalbot|megaindex|zoominfobot|barkrowler|seekportbot)" 1;
    "~*(bytespider|gptbot|ccbot|claudebot|anthropic-ai|google-extended|meta-externalagent|amazonbot|omgilibot|diffbot|timpibot|imagesiftbot|applebot-extended)" 1;
    "~*(python-requests|python-urllib|scrapy|aiohttp|httpx|go-http-client|libwww-perl|okhttp|wget)" 1;
}

# --- flood limits ----------------------------------------------------------------------------
# Per-address request budget for the /smart app (smart-app.conf): 30 r/s sustained with a burst
# of 100 absorbs a real browser's asset burst on first load, while a scraper pulling every page
# flat-out gets 429s. A whole classroom behind one Wi-Fi address shares this budget — if a class
# working together ever reports "Too many attempts"/429s, raise the rate here (say 60r/s) and
# the burst in smart-app.conf (say 200), then reload. Sign-in POSTs additionally go through the
# stricter smart_auth zone (learn-ratelimit.conf); both zones apply where both are declared.
limit_req_zone $binary_remote_addr zone=smart_flood:20m rate=30r/s;

# Per-address concurrent-connection cap (used in academy-site.conf). The O.N.E and PRO pages are
# 9–15 MB single files: without a cap one address can hold open enough parallel transfers to
# starve everyone. Browsers use 1 connection under HTTP/2, ~6 under HTTP/1.1 — 30 is generous.
limit_conn_zone $binary_remote_addr zone=perip:10m;
