# Rate-limit zone for the CIRCLE S.M.A.R.T sign-in, invite and reset POSTs (used in smart-app.conf).
# Installed as /etc/nginx/conf.d/learn-ratelimit.conf: limit_req_zone and map are only valid in the
# http{} block, and the stock nginx.conf includes conf.d/*.conf there.
#
# Only POSTs get a key; every other method maps to "", which nginx does not count.
# 10 per minute per address with a burst of 10: a person retrying a password never notices, a
# script does. A whole classroom behind one office Wi-Fi shares an address — if a class ever
# signs in together and sees "429", raise burst in smart-app.conf (say to 40) and reload, and
# raise IP_PER_MIN in src/lib/auth/rateLimit.ts to match (the app checks its own limit too).
map $request_method $smart_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $smart_auth_limit_key zone=smart_auth:10m rate=10r/m;
