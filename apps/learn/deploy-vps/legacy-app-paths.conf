# Legacy app URLs from the Vercel era (before 17 Sep 2026): the Next.js app then served
# /learn, /verify and /api at the domain root; it now lives under /smart on this box.
# Old tabs, bookmarks, cached pages and Supabase auth-email links keep working via 301s.
location = /learn { return 301 /smart/learn; }
location /learn/  { return 301 /smart$request_uri; }
location /verify/ { return 301 /smart$request_uri; }
location /api/    { return 301 /smart$request_uri; }
