# Security headers for every STATIC page on learn.optionlab.co.in: the Academy landing, the three
# course-detail pages, WINNERS, O.N.E, /fonts/ and the 404 page. Installed as
# /etc/nginx/snippets/learn-static-headers.conf and included INSIDE each location, because nginx
# add_header replaces the inherited set wherever a location declares one of its own. One file means
# a new location cannot quietly ship with fewer headers than its neighbours.
#
# CSP, source by source:
#   script/style 'unsafe-inline'  the pages are self-contained builds with inline <script>, <style> and
#                                 onclick handlers; tighten once the builds emit hashes.
#   img data:                     logos and O.N.E chart images are base64-inlined.
#   font 'self'                   IBM Plex is self-hosted under /fonts/.
#   connect circleoptionlab.com   landing Live Sessions / Championship / Ask, WINNERS and O.N.E score + video lists.
#   frame                         lesson videos: YouTube (nocookie), Vimeo, Bunny Stream — the only hosts embedUrl() emits.
# The /smart app proxy keeps its own policy in smart-app.conf (it also talks to Supabase).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://circleoptionlab.com; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://iframe.mediadelivery.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
