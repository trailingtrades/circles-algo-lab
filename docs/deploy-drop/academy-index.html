<style>
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:100 700;font-display:swap;src:url("/fonts/IBMPlexSans-var.woff2") format("woff2")}
:root{
  --bg:#050608; --panel:#0f1520; --panel-2:#151d2b; --line:#1c2433; --line-2:#243044;
  --ink:#f1f5f9; --ink-2:#cbd5e1; --ink-3:#93a4b5;
  --brand:#22b8f5; --brand-600:#0b74b8; --brand-ink:#0b1b33;
  --card:linear-gradient(to bottom right,#16233f,#0f1520 50%,#0c1322);
  --r:16px; --r-sm:12px; --maxw:1180px; --sp:clamp(16px,4vw,28px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#050608 linear-gradient(180deg,#0d0f13 0,#08090c 45%,#050608 100%) no-repeat;min-height:100%;scroll-behavior:smooth}
body{background:transparent;color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Nirmala UI","Noto Sans Devanagari",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums;overflow-x:hidden}
html[lang=hi] body{font-family:"Nirmala UI","Noto Sans Devanagari","IBM Plex Sans","Segoe UI",system-ui,sans-serif}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--sp)}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;font-weight:700}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--brand)}
.muted{color:var(--ink-3)}
.ic{flex:none;vertical-align:-3px}
[hidden]{display:none!important}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--brand);color:var(--brand-ink);padding:8px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:8px}

/* top bar: opaque, one hairline */
.top{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line);background:#111927}
.top-in{display:flex;align-items:center;gap:10px;height:72px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand img{width:44px;height:44px;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.1}
.brand .kick{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin-bottom:3px}
.brand b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sp{flex:1}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:99px;background:var(--panel);
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;transition:border-color .18s var(--ease),color .18s var(--ease)}
.chip:hover{border-color:var(--brand);color:var(--ink)}
.chip.primary{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.chip.primary:hover{background:#0d84d0}

/* hero — left-aligned, rings on the right (approved composition) */
.hero{padding:clamp(56px,9vw,112px) 0 clamp(40px,6vw,72px);position:relative}
.hero h1{font-size:clamp(34px,5.6vw,70px);font-weight:700;letter-spacing:-.035em;margin-top:14px}
.hero h1>span{display:block;text-wrap:balance}
.hero h1 .nw{white-space:nowrap}
html[lang=hi] .hero h1{font-size:clamp(32px,5.2vw,64px);line-height:1.3}
/* Text column stops short of the rings (same offsets as .rings below), so no headline or lede
   line runs under them at any desktop width. */
@media(min-width:961px){.hero h1,.hero .lede{max-width:calc(100vw - clamp(60px,13vw,240px) - min(38vw,460px) - max(0px,(100vw - var(--maxw))/2) - var(--sp) - 20px)}}
.hero h1 .g{background:linear-gradient(to right,#22b8f5,#00aeef 45%,#7ccdf9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:clamp(16px,2.2vw,20px);color:var(--ink-2);max-width:60ch;margin:22px 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:99px;font-weight:600;font-size:16px;
  border:1px solid transparent;transition:background-color .2s var(--ease),border-color .2s var(--ease)}
.btn.sm{min-height:42px;padding:0 18px;font-size:14px}
.btn.primary{background:var(--brand-600);color:#fff}
.btn.primary:hover{background:#0d84d0}
.btn.ghost{border-color:var(--line-2);color:var(--ink);background:rgba(15,21,32,.7)}
.btn.ghost:hover{border-color:var(--brand)}
.hero .cta .btn{min-height:56px;padding:0 28px;font-size:18px}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:44px;justify-content:space-between}
@media(max-width:960px){.stats{justify-content:flex-start}}
.stat b{display:block;font-size:clamp(24px,3.6vw,44px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat span{font-size:14px;font-weight:500;color:var(--ink-3)}
.rings{position:absolute;right:clamp(60px,13vw,240px);top:clamp(40px,8vw,100px);width:min(38vw,460px);aspect-ratio:1;pointer-events:none;opacity:.9}
@media(max-width:960px){.rings{display:none}}

/* sections */
.section{padding:clamp(40px,6vw,80px) 0;scroll-margin-top:84px}
.section-h{margin-bottom:28px;max-width:70ch}
.section-h h2{font-size:clamp(24px,3.6vw,36px);margin-top:6px}
.section-h p{color:var(--ink-2);margin-top:10px;font-size:16px}

/* the ladder — four stage cards (approved) */
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
@media(max-width:900px){.ladder{grid-template-columns:1fr}}
.stage{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:24px;display:flex;flex-direction:column;gap:14px}
.stage .num{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--brand)}
.stage .num i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-style:normal;font-size:13px;font-weight:700}
.stage h3{font-size:clamp(20px,2.4vw,24px)}
.stage h3 small{display:block;font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-top:4px}
.stage p{color:var(--ink-2);font-size:14px}
.stage ul{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--ink-2)}
.stage li{display:flex;gap:8px;align-items:flex-start}
.stage li .ic{color:var(--brand);margin-top:4px}
.stage .acts{margin-top:auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:6px}
.stage .hint{font-size:13px;color:var(--ink-3);display:inline-flex;gap:5px;align-items:center}
.stage.soon{border-style:dashed}
.stage.soon .num{color:var(--ink-3)}
.stage.soon .num i{background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line-2)}
.tag{display:inline-block;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-3);background:var(--panel-2)}
.tag.open{background:rgba(34,184,245,.12);color:var(--brand);border-color:rgba(34,184,245,.35)}

/* how to join */
.path{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:900px){.path{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.path{grid-template-columns:1fr}}
.step{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);padding:16px;font-size:14px;color:var(--ink-2)}
.step b{display:block;font-size:14px;color:var(--ink);margin-bottom:4px}
.step b span{color:var(--brand);margin-right:6px}

/* CIRCLE PRO tracks */
.tracks{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:1000px){.tracks{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.tracks{grid-template-columns:1fr}}
.pro-track{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;display:flex;flex-direction:column;gap:8px}
.pro-track .ic{width:40px;height:40px;border-radius:var(--r-sm);padding:9px;background:rgba(34,184,245,.12);color:var(--brand)}
.pro-track h3{font-size:16px;letter-spacing:-.01em}
.pro-track p{font-size:14px;color:var(--ink-3);flex:1}
.pro-track .lk{font-size:13px;color:var(--ink-2)}

/* live sessions */
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:16px}
.ls{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ls.past{opacity:.8}
.ls .top-r{display:flex;gap:12px;align-items:flex-start}
.ls .date{flex:none;width:58px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line-2);text-align:center;padding:6px 0}
.ls .date b{display:block;font-size:24px;line-height:1.1}
.ls .date span{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--brand)}
.ls h3{font-size:16px;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.ls .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ls .tg{font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3)}
.ls .tg.on{color:var(--brand);border-color:rgba(34,184,245,.35)}
.ls .tg.now{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.ls p{font-size:14px;color:var(--ink-2)}
.ls .meta{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.ls .meta .ic{margin-top:3px}
.ls .price-row{font-size:14px;color:var(--ink-2)}
.ls .price-row b{color:var(--ink)}
.ls .seat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3)}
.ls .seat b{color:var(--ink)}
.ls .bar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.ls .bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.ls .cd{font-size:13px;color:var(--ink-2)}
.ls .cd span{font-weight:600;color:var(--ink)}
.ls .btn{align-self:flex-start}
.ls-note{border:1px dashed var(--line-2);border-radius:var(--r);padding:24px;color:var(--ink-3);font-size:14px}
.ls-note b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.ls-note .cta{margin-top:14px}
.ls-empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;border:1px dashed var(--line-2);border-radius:var(--r);padding:24px}
@media(max-width:760px){.ls-empty{grid-template-columns:1fr}}
.ls-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.ls-empty p{color:var(--ink-2);font-size:14px}
.ls-empty .cta{margin-top:16px}
.ls-what h3{font-size:14px;color:var(--ink);margin-bottom:8px}
.ls-what ul{list-style:none;display:grid;gap:8px;font-size:14px;color:var(--ink-2)}
.ls-what li{display:flex;gap:8px}
.ls-what li .ic{color:var(--brand);margin-top:4px}
.segtabs{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;background:var(--panel);overflow:hidden;margin-bottom:18px}
.segtabs button{padding:0 16px;height:36px;font-size:13px;font-weight:600;color:var(--ink-3)}
.segtabs button.on{background:var(--brand);color:var(--brand-ink)}
/* booking dialog */
.overlay{position:fixed;inset:0;background:rgba(2,4,8,.78);display:grid;place-items:center;z-index:100;padding:16px;overflow-y:auto}
.modal{position:relative;width:min(560px,100%);border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);padding:24px;box-shadow:0 24px 48px -24px #000}
.modal h3{font-size:20px;margin:6px 40px 4px 0}
.modal>p{font-size:14px;margin-bottom:16px}
.modal .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line-2)}
.bk{display:grid;gap:12px}
.bk label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.bk input,.bk select{height:46px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.bk input:focus,.bk select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,184,245,.2)}
.bk .btn{width:100%}
.bk .fine{font-size:12px;color:var(--ink-3)}
.bk .fine a{color:var(--ink-2);text-decoration:underline}
.err{color:#fca5a5;font-size:13px;min-height:18px}
.ticket{border:1px dashed var(--brand);border-radius:var(--r-sm);padding:18px;text-align:center;background:rgba(34,184,245,.06)}
.ticket .lbl{font-size:12px;color:var(--ink-3)}
.ticket b{display:block;font-size:30px;letter-spacing:-.02em;color:var(--brand)}
.ticket .cta{justify-content:center;margin-top:12px}
.ticket .fine{font-size:12px;color:var(--ink-3);margin-top:10px}

/* championship */
.champ{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px;align-items:start}
@media(max-width:900px){.champ{grid-template-columns:1fr}}
.board{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden;font-size:14px}
.board th,.board td{padding:10px 14px;border-top:1px solid var(--line);text-align:left}
.board thead th{border-top:0;font-size:12px;font-weight:600;color:var(--ink-3);background:var(--panel-2)}
.board .n{text-align:right;width:70px}
.board td.rk{width:44px;font-weight:700;color:var(--ink-3)}
.board tr.top3 td.rk{color:var(--brand)}
.board td.pt{font-weight:700;color:var(--ink)}
.rules{border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:20px}
.rules h3{font-size:16px;margin-bottom:10px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.rule:first-of-type{border-top:0}
.rule .ic{color:var(--brand)}
.rule b{color:var(--ink);font-size:14px;white-space:nowrap}
.rules .cta{margin-top:14px}

@media(max-width:640px){
  .top{position:relative}
  .top-in{height:auto;padding-block:10px;gap:8px;flex-wrap:wrap}
  .brand{flex:1 0 100%}
  .nav{width:100%}
  .nav .chip .t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .stats{gap:18px}
  .hero .cta .btn{min-height:52px;padding:0 22px;font-size:16px}
}
/* floating WhatsApp enquiry button — WhatsApp green, white glyph; rebuilt by render() so the
   prefilled message and label follow the language toggle */
.wa-fab{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:50%;background:#25d366;color:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.7);transition:transform .15s ease,background .15s ease}
.wa-fab:hover{background:#1ebe5d;transform:scale(1.06)}
.wa-fab svg{width:28px;height:28px}
@media print{.wa-fab{display:none}}

.site-foot{border-top:1px solid var(--line);margin-top:24px;padding:40px 0 96px;font-size:13px;line-height:1.6;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr 1.5fr;gap:28px 24px}
@media(max-width:1100px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.site-foot h2{font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink);margin-bottom:10px}
.site-foot p{margin-bottom:10px}
.site-foot ul{list-style:none;display:grid;gap:6px}
.site-foot a{color:var(--ink-2)}
.site-foot a:hover{color:var(--ink);text-decoration:underline}
.site-foot b{color:var(--ink-2);font-weight:600}
.site-foot .fnote{margin-top:10px;font-size:12px}
.fmark{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fmark img{border-radius:50%}
.fmark b{font-size:16px;color:var(--ink)}
.fchip{display:inline-block;padding:3px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-weight:600;font-size:12px}
.fsoc{display:flex !important;gap:14px}
.fdot{opacity:.6}
.fbar .sp{flex:1}
.fbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-2)}
.site-foot .disc{font-size:12px;line-height:1.7;margin:16px 0 8px}
.site-foot .copy{font-size:12px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;background:var(--panel);overflow:hidden}
.seg button{padding:0 12px;height:34px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
.seg button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}

</style>

/* ---------- page ---------- */
function ringsSVG(){
  var c=["#22b8f5","#00aeef","#38bdf8","#0b74b8","#7ccdf9"], out="";
  for(var i=0;i<5;i++){ var r=52+i*34; out+='<circle cx="230" cy="230" r="'+r+'" fill="none" stroke="'+c[i]+'" stroke-opacity="'+(0.55-i*0.08)+'" stroke-width="'+(10-i)+'" stroke-dasharray="'+(r*6.283*(0.35+i*0.12))+' '+(r*6.283)+'" transform="rotate('+(-90+i*37)+' 230 230)"/>'; }
  return '<svg class="rings" viewBox="0 0 460 460" aria-hidden="true"><defs><radialGradient id="gl" cx="50%" cy="50%"><stop offset="0" stop-color="#00aeef" stop-opacity=".2"/><stop offset="1" stop-color="#00aeef" stop-opacity="0"/></radialGradient></defs><circle cx="230" cy="230" r="220" fill="url(#gl)"/>'+out+'<image href="'+LOGO+'" x="170" y="170" width="120" height="120"/></svg>';
}
/* Card titles break after "CIRCLE" so all four programme names line up. */
function stage(n, k, acts, soon, tag){
  var tw=String(T(k+'t')).split(' ');
  return '<article class="stage'+(soon?' soon':'')+'"><div class="num"><i>'+n+'</i>'+esc(T('st'))+' '+n+'<span class="sp"></span><span class="tag'+(soon?'':' open')+'">'+esc(tag||T(soon?'next':'live'))+'</span></div>'+
    '<h3>'+esc(tw[0])+'<br>'+esc(tw.slice(1).join(' '))+'<small>'+esc(T(k+'s'))+'</small></h3><p>'+esc(T(k+'p'))+'</p><ul>'+T(k+'l').map(li).join('')+'</ul><div class="acts">'+acts+'</div></article>';
}
function acts(open, about){
  return '<a class="btn primary sm" href="'+open+'">'+esc(T('open'))+' '+ico('arrow',15)+'</a><a class="btn ghost sm" href="'+about+'">'+esc(T('learnMore'))+'</a>'+
    '<span class="hint">'+ico('key',13)+' '+esc(T('signHint'))+'</span>';
}
var HASH = ''; try { HASH = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
/* The page is drawn by script, so a shared #live / #champ link has nothing to land on at load.
   Scroll once the target exists — and for the two API sections, once their data has settled. */
function jumpToHash(){
  if(!HASH) return;
  if((HASH==='live'&&(LIVE.state==='idle'||LIVE.state==='loading'))||(HASH==='champ'&&(CH.state==='idle'||CH.state==='loading'))) return;
  var t=document.getElementById(HASH); HASH=''; if(t) t.scrollIntoView();
}
function render(){
  var root=document.documentElement; root.lang=htmlLang(lang); root.setAttribute('data-lang',lang);
  document.title=T('docTitle'); document.querySelector('.skip').textContent=T('skip');
  var cur=LANGS.filter(function(L){ return L.k===lang; })[0], nx=LANGS[(LANGS.indexOf(cur)+1)%LANGS.length];
  var lv=liveLists(), liveHot=LIVE.state==='ok'&&lv.up.length>0, champHot=CH.state==='ok'&&CH.rows.length>0;
  var tracks=[["strategy","t1"],["calc","t2"],["bookopen","t3"],["brain","t4"]];
  document.getElementById("app").innerHTML=
  '<header class="top"><div class="wrap top-in">'+
    '<a class="brand" href="/" aria-label="'+esc(T('brand'))+'"><img src="'+LOGO+'" alt="" width="44" height="44"><span class="bt"><span class="kick">5 Circles Pvt Ltd</span><b>'+esc(T('brand'))+'</b></span></a>'+
    '<span class="sp"></span><nav class="nav" aria-label="'+esc(T('navLabel'))+'">'+
    '<a class="chip" href="#live" aria-label="'+esc(T('navLive'))+'">'+ico('mic',15)+' <span class="t">'+esc(T('navLive'))+'</span></a>'+
    '<a class="chip" href="#champ" aria-label="'+esc(T('navChamp'))+'">'+ico('trophy',15)+' <span class="t">'+esc(T('navChamp'))+'</span></a>'+
    '<button type="button" class="chip" onclick="setLang(\''+nx.k+'\')" aria-label="'+esc(T('langBtn'))+' ('+esc(cur.l)+')" title="'+esc(T('langBtn'))+'">'+ico('lang',15)+' <span lang="'+cur.html+'">'+esc(cur.l)+'</span></button>'+
    '<a class="chip primary" href="/smart/learn">'+ico('key',15)+' <span>'+esc(T('signin'))+'</span></a>'+
  '</nav></div></header>'+
  '<main id="main">'+
  '<section class="hero"><div class="wrap">'+ringsSVG()+
    '<div class="eyebrow">5 Circles Pvt Ltd · SEBI RA INH000020004</div>'+
    '<h1><span>'+nw(T('h1a'))+'<span class="g">'+nw(T('h1b'))+'</span>'+nw(T('h1c'))+'</span><span>'+nw(T('h1d'))+'</span></h1>'+
    '<p class="lede">'+esc(T('lede'))+'</p>'+
    '<div class="cta"><a class="btn primary" href="#ladder">'+esc(T('startCta'))+' '+ico('down',18)+'</a>'+
      '<a class="btn ghost" href="/smart/learn">'+ico('key',16)+' '+esc(T('signin'))+'</a>'+
      '<a class="btn ghost" href="'+wa(T('waMsg'))+'" target="_blank" rel="noopener">'+ico('chat',16)+' '+esc(T('wa'))+'</a></div>'+
    '<div class="stats"><div class="stat"><b>4</b><span>'+esc(T('s1'))+'</span></div><div class="stat"><b>'+(COUNTS.smart+COUNTS.winners+COUNTS.one)+'</b><span>'+esc(T('s2'))+'</span></div>'+
      '<div class="stat"><b>3</b><span>'+esc(T('s3'))+'</span></div><div class="stat"><b>INH000020004</b><span>'+esc(T('s4'))+'</span></div></div>'+
  '</div></section>'+
  '<section class="section" id="ladder" aria-labelledby="ladder-h"><div class="wrap">'+
    '<div class="section-h"><h2 id="ladder-h">'+esc(T('ladderH'))+'</h2><p>'+esc(T('ladderP'))+'</p></div>'+
    '<div class="ladder">'+stage(0,'sS','<a class="btn primary sm" href="/smart/stage0/">'+esc(T('open'))+' '+ico('arrow',15)+'</a><span class="hint">'+ico('key',13)+' '+esc(T('signHint'))+'</span>',false,T('free'))+stage(1,'s0',acts('/smart/learn','/smart/about/'))+stage(2,'s1',acts('/winners/','/winners/about/'))+stage(3,'s2',acts('/one/','/one/about/'))+
      stage(4,'s3','<a class="btn primary sm" href="/pro/options/">'+esc(T('open'))+' '+ico('arrow',15)+'</a>'+
        '<a class="btn ghost sm" href="'+wa(T('waPro'))+'" target="_blank" rel="noopener">'+ico('chat',15)+' '+esc(T('notify'))+'</a>'+
        '<span class="hint">'+ico('key',13)+' '+esc(T('signHint'))+'</span>',true,T('part'))+'</div>'+
  '</div></section>'+
  /* Live sessions and the championship sit right under the ladder only when they have something
     to show; empty, loading or failed, they drop below "How to join" and the PRO tracks. */
  (liveHot?liveSection(lv):'')+(champHot?champSection():'')+
  '<section class="section" id="how" aria-labelledby="how-h"><div class="wrap">'+
    '<div class="section-h"><h2 id="how-h">'+esc(T('howH'))+'</h2></div>'+
    '<ol class="path">'+T('p').map(function(s,i){ return '<li class="step"><b><span>'+(i+1)+'</span>'+esc(s[0])+'</b>'+esc(s[1])+'</li>'; }).join('')+'</ol>'+
    '<div class="cta" style="margin-top:24px"><a class="btn primary" href="'+wa(T('waMsg'))+'" target="_blank" rel="noopener">'+ico('chat',16)+' '+esc(T('wa'))+'</a><a class="btn ghost" href="/smart/learn">'+ico('key',16)+' '+esc(T('signin'))+'</a></div>'+
  '</div></section>'+
  '<section class="section" id="pro" aria-labelledby="pro-h"><div class="wrap">'+
    '<div class="section-h"><div class="eyebrow">'+esc(T('proKick'))+'</div><h2 id="pro-h">'+esc(T('proH'))+'</h2><p>'+esc(T('proP'))+'</p></div>'+
    '<div class="tracks">'+tracks.map(function(t){ return '<div class="pro-track">'+ico(t[0],40)+'<h3>'+esc(T(t[1]))+'</h3><p>'+esc(T(t[1]+'p'))+'</p><span class="lk">'+esc(T(t[1]+'l'))+'</span>'+(t[1]==='t1'?'<a class="btn primary sm" style="margin-top:8px;align-self:flex-start" href="/pro/options/">'+esc(T('open'))+' '+ico('arrow',15)+'</a>':'')+'</div>'; }).join('')+'</div>'+
  '</div></section>'+
  (liveHot?'':liveSection(lv))+(champHot?'':champSection())+
  '</main>'+footerHTML(lang, langSeg(lang))+
  /* WhatsApp glyph is a filled path, unlike the stroke icons in ICO, so it stays inline here. */
  '<a class="wa-fab" href="'+wa(T('waMsg'))+'" target="_blank" rel="noopener" aria-label="'+esc(T('wa'))+'" title="'+esc(T('wa'))+'">'+
    '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12.04 2a9.9 9.9 0 0 0-8.57 14.86L2 22l5.27-1.38A9.9 9.9 0 1 0 12.04 2Zm0 1.67a8.23 8.23 0 1 1-4.2 15.31l-.3-.18-3.12.82.83-3.04-.2-.31a8.23 8.23 0 0 1 7-12.6Zm-3.35 3.6c-.18 0-.47.07-.72.34-.25.27-.94.92-.94 2.24s.97 2.6 1.1 2.78c.14.18 1.9 2.9 4.6 4.06.64.28 1.14.44 1.53.57.64.2 1.23.17 1.69.1.52-.07 1.59-.65 1.81-1.27.23-.63.23-1.16.16-1.27-.07-.12-.25-.18-.52-.32-.27-.13-1.59-.78-1.83-.87-.25-.09-.43-.14-.61.13-.18.27-.7.88-.85 1.06-.16.18-.32.2-.58.07a7.33 7.33 0 0 1-2.16-1.33 8.1 8.1 0 0 1-1.49-1.86c-.16-.27-.02-.42.12-.55.12-.12.27-.32.4-.47.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.47-.07-.13-.6-1.45-.83-1.98-.21-.52-.44-.5-.61-.5h-.52Z"/></svg></a>';
  tick(); jumpToHash();
}
render();
loadLive(); loadChamp();
</script>
</body>
</html>
